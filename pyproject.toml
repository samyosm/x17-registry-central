[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "x17-registry-central"
version = "0.1.0"
description = "Source-preserving X17 ingestion service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
  "numpy>=2.2,<3",
  "pyzmq>=26,<28",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
x17-registry = "x17_registry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/x17_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
